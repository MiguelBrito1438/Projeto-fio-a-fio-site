app = "fio-a-fio-api-miguel"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "h2"
  DB_FILE = "/data/pedidos"
  CORS_ORIGINS = "https://fio-a-fio.miguelmilianobritocampos.workers.dev"

[[mounts]]
  source = "pedidos_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/api/pedidos?page=0&size=1"
