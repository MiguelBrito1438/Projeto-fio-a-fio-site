spring.application.name=pedidos-agreste-api
server.port=${PORT:8080}

# --- Banco de dados (credenciais via variaveis de ambiente; NUNCA publique senhas no GitHub) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos_agreste?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update = cria/ajusta as tabelas automaticamente. Para usar somente o script banco/schema.sql, rode com DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Fortaleza

spring.jackson.time-zone=America/Fortaleza

# Origens permitidas para o front-end (CORS). Separe por virgula. Em desenvolvimento, * libera tudo.
app.cors.allowed-origins=${CORS_ORIGINS:*}
